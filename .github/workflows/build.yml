name: Build pages

# Runs tools/build.py after every push to main, so you only have to edit index.html /
# js/language-switcher.js and push. The Greek and English HTML are refreshed automatically.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'js/language-switcher.js'
      - 'tools/build.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run build script
        run: python3 tools/build.py
      - name: Commit refreshed pages
        run: |
          if git diff --quiet -- index.html en/index.html; then
            echo "Pages already up to date"
          else
            git config user.name "build-bot"
            git config user.email "actions@users.noreply.github.com"
            git add index.html en/index.html
            git commit -m "chore: refresh pages from translations (build.py)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
